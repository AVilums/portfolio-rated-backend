[project]
name = "portfolio-risk-api"
version = "0.2.0"
description = "Portfolio Rated API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/risk_platform"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL test database"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
