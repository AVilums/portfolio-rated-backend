name: portfolio-rated
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://risk:risk@postgres:5432/risk
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://risk:risk@postgres:5432/risk
      APP_ENV: local
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      MARKET_DATA_MAX_AGE_HOURS: ${MARKET_DATA_MAX_AGE_HOURS:-24}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../portfolio-rated-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: risk_test
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://risk:risk@test-db:5432/risk_test
      TEST_DATABASE_URL: postgresql+psycopg://risk:risk@test-db:5432/risk_test
      APP_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest -q -p no:cacheprovider"]

volumes:
  postgres-data:
