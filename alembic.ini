[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://risk:risk@localhost:5432/risk

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
qualname = sqlalchemy
level = WARN
handlers =
[logger_alembic]
qualname = alembic
level = INFO
handlers =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
