apiVersion: v1
kind: Service
metadata:
  name: risk-api
spec:
  selector:
    app.kubernetes.io/name: risk-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-api
    spec:
      containers:
        - name: api
          image: portfolio-risk-api:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - alembic upgrade head && exec uvicorn risk_platform.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: risk-platform-config
            - secretRef:
                name: risk-platform-secrets
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
