apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-worker
    spec:
      containers:
        - name: worker
          image: portfolio-risk-api:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "risk_platform.worker.main"]
          envFrom:
            - configMapRef:
                name: risk-platform-config
            - secretRef:
                name: risk-platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
